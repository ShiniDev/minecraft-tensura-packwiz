	#HP percentage threshold for evolution (0.50 = 50%).
	beelzebuthHPThreshold = 0.5
	#Whether Beelzebuth evolution is allowed.
	enableBeelzebuthEvolution = true

[UltMastery]
	#The max amount of mastery points for Sin Ultimate Skills.
	masterySinUlt = 15000
	#The max amount of mastery points for Virtue Ultimate Skills.
	masteryVirtueUlt = 25000
	#The max amount of mastery points for Angelic Ultimate Skills.
	masteryAngelicUlt = 5000
	#The max amount of mastery points for Demonic Ultimate Skills.
	masteryDemonicUlt = 5000
	#The max amount of mastery points for Champion Ultimate Skills.
	masteryChampionUlt = 25000
	#The max amount of mastery points for Abyssal Ultimate Skills.
	masteryAbyssalUlt = 5000
	#The max amount of mastery points for Generic Ultimate Skills.
	masteryGenericUlt = 5000
